<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Баткен Экспресс — тез жеткирүү кызматы">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#CC1010">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Баткен Экспресс">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Баткен Экспресс</title>
  <style>
    body { margin: 0; background-color: #CC1010; }
    #loading {
      position: fixed; inset: 0; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      background: #CC1010; z-index: 9999;
    }
    #loading img { width: 120px; height: 120px; border-radius: 50%; }
    #loading p { color: white; margin-top: 16px; font-family: sans-serif; font-size: 14px; }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="loading">
    <img src="icons/Icon-192.png" alt="Баткен Экспресс" />
    <p>Жүктөлүүдө...</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var el = document.getElementById('loading');
      if (el) el.style.display = 'none';
    });

    // Called from Dart: window.batkenSubscribePush(vapidKey, onSuccess, onError)
    // The push SW is registered lazily here with scope '/push/' so it does NOT
    // interfere with Flutter's own flutter_service_worker.js at scope '/'.
    window.batkenSubscribePush = function(vapidKey, onSuccess, onError) {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        onError('unsupported'); return;
      }
      if (Notification.permission === 'denied') {
        onError('denied'); return;
      }

      function urlB64ToUint8Array(b64) {
        var padding = '='.repeat((4 - b64.length % 4) % 4);
        var base64 = (b64 + padding).replace(/-/g, '+').replace(/_/g, '/');
        var raw = window.atob(base64);
        var arr = new Uint8Array(raw.length);
        for (var i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
        return arr;
      }

      function waitForActive(reg) {
        if (reg.active) return Promise.resolve(reg);
        var sw = reg.installing || reg.waiting;
        if (!sw) return Promise.reject('no sw');
        return new Promise(function(resolve, reject) {
          sw.addEventListener('statechange', function() {
            if (sw.state === 'activated') resolve(reg);
            if (sw.state === 'redundant') reject('sw redundant');
          });
        });
      }

      // Register push SW under scope '/push/' — separate from Flutter's SW at '/'
      navigator.serviceWorker
        .register('/push-sw.js', { scope: '/push/' })
        .then(waitForActive)
        .then(function(reg) {
          return reg.pushManager.getSubscription().then(function(existing) {
            if (existing) return existing; // re-use, Dart will upsert to backend
            var permPromise = Notification.permission === 'granted'
              ? Promise.resolve('granted')
              : Notification.requestPermission();
            return permPromise.then(function(perm) {
              if (perm !== 'granted') return Promise.reject('permission_denied');
              return reg.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlB64ToUint8Array(vapidKey)
              });
            });
          });
        })
        .then(function(sub) { onSuccess(JSON.stringify(sub)); })
        .catch(function(e) { onError(String(e)); });
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
